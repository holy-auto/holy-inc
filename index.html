    <script>
      // Hide critical hero only after React has actually mounted content
      (function() {
        var root = document.getElementById('root');
        var crit = document.getElementById('hero-crit');
        if (!root || !crit) return;
        var attempts = 0;
        function check() {
          attempts++;
          if (root.children.length > 0 && root.textContent.length > 300) {
            crit.style.opacity = '0';
            crit.style.transition = 'opacity 0.3s ease';
            setTimeout(function() { crit.style.display = 'none'; }, 300);
            return;
          }
          if (attempts < 90) {
            requestAnimationFrame(check);
          } else {
            crit.style.opacity = '0';
            setTimeout(function() { crit.style.display = 'none'; }, 300);
          }
        }
        setTimeout(check, 200);
      })();
    </script>
