    <!-- Critical CSS inline: Hero section render-blocking-free paint -->
    <style>
      /* Critical path: Hero background and text rendered instantly before JS */
      #hero-crit {
        position: relative;
        width: 100%;
        min-height: 700px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #0c0a09;
        pointer-events: none;
        font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      }
      #hero-crit::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(115% 85% at 50% 118%, rgba(217,119,6,0.20), rgba(217,119,6,0.05) 38%, transparent 62%);
      }
      #hero-crit::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 -140px 160px -60px rgba(0,0,0,0.9), inset 0 0 240px 40px rgba(0,0,0,0.55);
      }
      #hero-crit-inner {
        position: relative;
        z-index: 10;
        text-align: left;
        width: 100%;
        padding: 0 1.5rem;
        max-width: 72rem;
        margin: 0 auto;
      }
      #hero-crit .overline {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      #hero-crit .overline i {
        display: inline-block;
        width: 2.5rem;
        height: 1px;
        background: linear-gradient(90deg, #fbbf24, rgba(251,191,36,0));
      }
      #hero-crit .subtitle {
        color: rgba(252,211,77,0.9);
        font-size: 0.8rem;
        letter-spacing: 0.35em;
        font-weight: 500;
      }
      #hero-crit h1 {
        color: #ffffff;
        font-size: 2.6rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.14;
      }
      #hero-crit h1 .accent {
        background: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #d97706 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #hero-crit .lead {
        color: rgba(214,211,209,0.9);
        font-size: 1rem;
        font-weight: 300;
        letter-spacing: 0.02em;
        line-height: 1.7;
        margin-top: 2rem;
        max-width: 36rem;
      }
      #hero-crit .cta-row {
        margin-top: 2.5rem;
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      #hero-crit .cta-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        background: #fbbf24;
        color: #0c0a09;
        padding: 0.85rem 2rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        text-decoration: none;
        white-space: nowrap;
      }
      #hero-crit .cta-secondary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: rgba(255,255,255,0.7);
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.025em;
        text-decoration: none;
        white-space: nowrap;

  <body>
    <div id="root"></div>
    <!-- Critical HTML: visible before React mounts, eliminates white-screen LCP penalty -->
    <section id="hero-crit" aria-label="HOLY">
      <div id="hero-crit-inner">
        <p class="overline"><i></i><span class="subtitle">株式会社HOLY</span></p>
        <h1>職人の技術を、<br><span class="accent">次へつなぐ。</span></h1>
        <p class="lead">一つの技を、次の時代へ。コーティング・洗車・証明——三つの事業で、職人の仕事を資産に変えていく。</p>
        <div class="cta-row">

          <a href="/about" class="cta-secondary">HOLYについて</a>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide critical hero only after React has actually mounted content
      (function() {
        var root = document.getElementById('root');
        var crit = document.getElementById('hero-crit');
        if (!root || !crit) return;
        var attempts = 0;
        function check() {
          attempts++;
          if (root.children.length > 0 && root.textContent.length > 300) {
            crit.style.opacity = '0';
            crit.style.transition = 'opacity 0.3s ease';
            setTimeout(function() { crit.style.display = 'none'; }, 300);
            return;
          }
          if (attempts < 90) {
            requestAnimationFrame(check);
          } else {
            crit.style.opacity = '0';
            setTimeout(function() { crit.style.display = 'none'; }, 300);
          }
        }
        setTimeout(check, 200);
      })();
    </script>
